server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # 해시가 붙은 빌드 파일은 내용이 바뀌면 이름도 바뀌므로 오래 캐시한다
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: /react/hooks 같은 주소로 바로 들어와도 index.html을 주고 라우팅은 React Router가 한다
  location / {
    try_files $uri $uri/ /index.html;
  }
}
